<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pembayaran Gagal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .card {
      background: #fff; border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      padding: 40px; width: 100%; max-width: 460px; text-align: center;
    }
    .icon { font-size: 64px; margin-bottom: 16px; }
    h1 { color: #991b1b; font-size: 24px; margin-bottom: 8px; }
    p { color: #555; font-size: 14px; line-height: 1.6; margin-bottom: 16px; }
    .order-id {
      background: #fee2e2; border: 1px solid #fecaca; border-radius: 8px;
      padding: 12px; margin: 16px 0; font-family: monospace; font-size: 13px; color: #991b1b;
    }
    .btn {
      display: inline-block; margin-top: 16px; padding: 14px 32px;
      background: #dc2626; color: #fff; border-radius: 8px;
      text-decoration: none; font-weight: 600; font-size: 14px;
    }
    .btn:hover { background: #b91c1c; }
    .help {
      background: #f8fafc; border-radius: 8px; padding: 14px;
      margin-top: 20px; font-size: 12px; color: #555; text-align: left;
    }
    .secondary-link {
      display: inline-block; margin-top: 12px; color: #667; font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">❌</div>
    <h1>Pembayaran Gagal</h1>
    <p>Maaf, terjadi masalah saat memproses pembayaran GoPay kamu.</p>
    <div class="order-id" id="orderId">Loading...</div>

    <div class="help">
      <strong>Kemungkinan penyebab:</strong>
      <ul style="margin-top:8px; padding-left:16px;">
        <li>Saldo GoPay tidak mencukupi</li>
        <li>Transaksi ditolak oleh GoPay</li>
        <li>Waktu pembayaran sudah expired</li>
        <li>Koneksi internet terputus</li>
      </ul>
    </div>

    <a class="btn" href="/gopay">Coba Lagi</a>
    <br />
    <a class="secondary-link" href="/">← Kembali ke Halaman Utama</a>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('order_id') || '-';
    document.getElementById('orderId').textContent = `Order ID: ${orderId}`;
  </script>
</body>
</html>
