<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pembayaran Belum Selesai</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .card {
      background: #fff; border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      padding: 40px; width: 100%; max-width: 460px; text-align: center;
    }
    .icon { font-size: 64px; margin-bottom: 16px; }
    h1 { color: #92400e; font-size: 24px; margin-bottom: 8px; }
    p { color: #555; font-size: 14px; line-height: 1.6; margin-bottom: 16px; }
    .order-id {
      background: #fef3c7; border: 1px solid #fde68a; border-radius: 8px;
      padding: 12px; margin: 16px 0; font-family: monospace; font-size: 13px; color: #92400e;
    }
    .btn {
      display: inline-block; margin-top: 16px; padding: 14px 32px;
      background: #f59e0b; color: #fff; border-radius: 8px;
      text-decoration: none; font-weight: 600; font-size: 14px;
    }
    .btn:hover { background: #d97706; }
    .secondary-link {
      display: inline-block; margin-top: 12px; color: #667; font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⏳</div>
    <h1>Pembayaran Belum Selesai</h1>
    <p>
      Kamu meninggalkan halaman pembayaran sebelum menyelesaikan transaksi.<br />
      Transaksi masih aktif - kamu bisa coba lagi.
    </p>
    <div class="order-id" id="orderId">Loading...</div>
    <a class="btn" href="/gopay">Coba Bayar Lagi</a>
    <br />
    <a class="secondary-link" href="/">← Kembali ke Halaman Utama</a>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('order_id') || '-';
    document.getElementById('orderId').textContent = `Order ID: ${orderId}`;
  </script>
</body>
</html>
